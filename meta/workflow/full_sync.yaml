name: FullSyncWorkflow
entity: Product
steps:
  - action: transform
    rules: [{ field: price, op: multiply, value: 1.25 }]
  - action: validate
    rules: [missing_images, missing_sku, invalid_price, valid_ean_13]
  - action: calculate
    using: quality_weights
  - action: validate
    rules: [ready_for_publication]
  - action: persist
