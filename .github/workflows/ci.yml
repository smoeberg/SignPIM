name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -q --tb=short
      - name: OpenAPI contract is current
        run: |
          PYTHONPATH=. python scripts/export_openapi.py docs/openapi.json
          git diff --exit-code docs/openapi.json || (echo "::error::OpenAPI spec out of date — run scripts/export_openapi.py" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t signpim-api:${{ github.sha }} .
      - name: Compose config valid (prod requires env)
        run: |
          POSTGRES_PASSWORD=test POSTGRES_DSN=postgresql://x docker compose -f docker-compose.prod.yml config > /dev/null
